name: Build MSI

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
  id-token: write # GitHub OIDC login to Azure for Artifact Signing

jobs:
  build:
    runs-on: windows-latest
    # One federated credential (entity type "Environment", name "signing") covers every branch and tag.
    environment: signing
    env:
      # Artifact Signing settings are not secret: repository variables (Settings → Secrets and variables → Actions → Variables).
      ARTIFACT_SIGNING_ENDPOINT: ${{ vars.ARTIFACT_SIGNING_ENDPOINT }}
      ARTIFACT_SIGNING_ACCOUNT: ${{ vars.ARTIFACT_SIGNING_ACCOUNT }}
      ARTIFACT_SIGNING_PROFILE: ${{ vars.ARTIFACT_SIGNING_PROFILE }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x

      - name: Determine version
        shell: pwsh
        run: |
          if ('${{ github.ref_type }}' -eq 'tag') {
            $version = '${{ github.ref_name }}'.TrimStart('v')
          } else {
            $version = '1.0.${{ github.run_number }}'
          }
          "VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      # Artifact Signing is used when its variables and AZURE_CLIENT_ID are configured, otherwise a
      # PFX certificate when SIGNING_PFX_BASE64 is set, otherwise the build is unsigned.
      # Pull requests are never signed.
      - name: Choose signing method
        id: signing
        shell: pwsh
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          PFX_BASE64: ${{ secrets.SIGNING_PFX_BASE64 }}
        run: |
          $method = 'None'
          if ('${{ github.event_name }}' -ne 'pull_request') {
            if ($env:ARTIFACT_SIGNING_ACCOUNT -and $env:AZURE_CLIENT_ID) {
              $method = 'ArtifactSigning'
            } elseif ($env:PFX_BASE64) {
              $path = Join-Path $env:RUNNER_TEMP 'signing.pfx'
              [IO.File]::WriteAllBytes($path, [Convert]::FromBase64String($env:PFX_BASE64))
              "SIGNING_PFX_PATH=$path" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
              $method = 'Pfx'
            }
          }
          Write-Host "Signing method: $method"
          "method=$method" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Azure login (Artifact Signing)
        if: steps.signing.outputs.method == 'ArtifactSigning'
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          allow-no-subscriptions: true

      - name: Test, publish, sign and build MSI
        shell: pwsh
        env:
          SIGNING_PFX_PASSWORD: ${{ secrets.SIGNING_PFX_PASSWORD }}
        run: ./build.ps1 -Version $env:VERSION -Sign ${{ steps.signing.outputs.method }}

      - name: Remove certificate file
        if: always() && steps.signing.outputs.method == 'Pfx'
        shell: pwsh
        run: Remove-Item -Force -ErrorAction SilentlyContinue $env:SIGNING_PFX_PATH

      - name: Upload MSI
        uses: actions/upload-artifact@v4
        with:
          name: AzureSubnetPlanner-${{ env.VERSION }}
          path: artifacts/msi/*.msi
          if-no-files-found: error

      - name: Publish GitHub release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/msi/*.msi
